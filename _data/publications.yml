- id: wittgenstein-classical-german-philosophy
  type: edited
  title: Wittgenstein and Classical German Philosophy – Logic, Language, Life
  editors: Alexander Berg & Denys Kaidalov
  publisher: De Gruyter, Berlin/New York
  date: 2025
  isbn: "978-3-11-069844-2"
  url: https://doi.org/10.1515/9783110698497
  cover: /images/covers/wittgenstein-classical-german-philosophy.jpg
  cover_height: 654
  endorsements_source:
    label: publisher’s page
    url: https://doi.org/10.1515/9783110698497
  endorsements:
    - by: Michael Beaney (Humboldt University of Berlin, University of Aberdeen)
      quote: "This is a stimulating collection of papers exploring the rich connections between Wittgenstein’s thought and classical German philosophy, especially Hegel’s philosophy. Focusing on the general themes of logic, language, and life, this volume can be recommended."
    - by: Hans-Johann Glock (University of Zurich)
      quote: "Although this topic is highly important, it has only recently attracted the attention it deserves. The contributors in this volume are leading experts in the field, and their articles shed novel light not just on fascinating strands in the history of ideas, but also on their continuing philosophical relevance, e.g. in Pittsburgh philosophy, critical theory and aesthetics."
    - by: Jakub Mácha (Masaryk University in Brno)
      quote: "A seminal publication for anyone interested in the development of analytic philosophy, this book is essential reading for understanding the ongoing dialogue between Wittgenstein’s innovations and traditional philosophical frameworks."

- id: wittgenstein-hegel-reevaluation
  type: edited
  title: Wittgenstein and Hegel – Reevaluation of Difference
  editors: Jakub Mácha & Alexander Berg
  series: On Wittgenstein (5), James Conant, Wolfgang Kienzler, Stefan Majetschak, Volker Munz, Josef Rothhaupt, David Stern, Wilhelm Vossenkuhl (eds.)
  publisher: De Gruyter, Berlin/New York
