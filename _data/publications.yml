- id: wittgensteins-hegel
  type: monograph
  title: Wittgensteins Hegel
  publisher: Wilhelm Fink Verlag, Paderborn
  date: 2021
  note: with the support of the VG Wort Science Promotion Fund
  isbn: "978-3-7705-6570-2"
  url: https://doi.org/10.30965/9783846765708
  cover: /images/covers/wittgensteins-hegel.jpg
  cover_height: 659
  cover_credit: "Cover: Wittgenstein, Ms 131, p. 154 – The Master and Fellows of Trinity College Cambridge"
  reviews:
    - by: Peter Eschweiler
      source: Bibliographie zur Symbolik, Ikonographie und Mythologie 54/2021, pp. 22–23
      lang: de
      quote: "Ohne Rekurs auf die Hegelsche Logik ist – so die These des Verf. – Wittgensteins Stellung in der Geschichte der Philosophie unverständlich. […] Der geneigte Leser findet bei Berg eine ausführliche Wertung der Auseinandersetzungen, die der späte Wittgenstein mit den Zeitgenossen Russell oder Whitehead geführt hat, vor allem seine Ausführungen im Rahmen der Cambridge-Vorlesungen, zu denen erst kürzlich veröffentlichte Mitschriften Zugang verschaffen. […] In Kap. V § 18 finden sich höchst wertvolle grundsätzliche Einsichten, die sich der Sprachanalytik verdanken. […] Der Band enthält überraschende Details zu Wittgensteins Position in der Geschichte der modernen Philosophie …"
      translation: "Without recourse to Hegel’s logic – such is the author’s thesis – Wittgenstein’s place in the history of philosophy cannot be understood. […] The interested reader will find in Berg a detailed assessment of the later Wittgenstein’s debates with his contemporaries Russell or Whitehead, above all of his remarks in the Cambridge lectures, to which only recently published lecture notes give access. […] Chapter V, § 18 offers highly valuable fundamental insights owed to the analysis of language. […] The volume contains surprising details on Wittgenstein’s position in the history of modern philosophy …"

