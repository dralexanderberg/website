- id: identity-in-difference
  type: article
  title: Identity in Difference – Wittgenstein’s Hegel
  in: Wittgenstein and Hegel – Reevaluation of Difference
  in_editors: Jakub Mácha & Alexander Berg (eds.)
  publisher: De Gruyter
  date: 2019
  pages: 349–364
  url: https://doi.org/10.1515/9783110572780-024
  discussed:
    - by: Diogo Ferrer (University of Coimbra)
      source: Wittgenstein-Studien 14 (1), 2023, p. 278
      url: https://doi.org/10.1515/witt-2023-0015
      quote: "… the study by Alexander Berg (349–364) is especially significant, as it is the only one to present a factual account of Wittgenstein’s words and writing about Hegel. One main result of Berg’s study (further developed in Berg’s <i>Wittgensteins Hegel</i> […]) is the claim that Wittgenstein’s notion of ‘language game’ was likely inspired by the reception of Hegel’s dialectic by Russell and, more specifically, by C. D. Broad in 1929."
    - by: Guido Tana (University of Pavia)
      source: "“Unlikely Bedfellows? On a recent rapprochement between Hegel and Wittgenstein”, Verifiche XLIX (1–2), 2020, pp. 340–341"
      quote: "Berg tackles the usually casted-aside question of whether Hegelian Idealism might have had an actual influence in shaping Wittgenstein’s thought. […] Berg suggests that Wittgenstein’s concept of Sprachspiele might have been substantially informed by Broad’s contention that Hegelian dialectic is akin to playing a game."

