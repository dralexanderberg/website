  toc: /files/conferences/toc.pdf
  reviews:
    - by: Stany Mazurkiewicz (Université de Liège)
      source: Bulletin de littérature hégélienne XXX, 2020, pp. 182–183
      url: https://doi.org/10.3917/aphi.834.0149
      lang: fr
      quote: "… ce très riche ouvrage, qui est assurément à inclure parmi les contributions significatives aux études hégéliennes."
      translation: "… this very rich work, which certainly belongs among the significant contributions to Hegel studies."
    - by: Guido Tana (University of Pavia)
      source: "“Unlikely Bedfellows? On a recent rapprochement between Hegel and Wittgenstein”, Verifiche XLIX (1–2), 2020, pp. 333–346"
      quote: "… this collection is the first systematic collective attempt in establishing a background on which future engagement on the topics of idealism and language can be played out, and it should serve as the benchmark for future endeavors on the topic."
    - by: Diogo Ferrer (University of Coimbra)
      source: Wittgenstein-Studien 14 (1), 2023, pp. 277–283
      url: https://doi.org/10.1515/witt-2023-0015
      quote: "Although a comparative study between Hegel and Wittgenstein is not unprecedented, this collection is groundbreaking due to the number and the significant scope of perspectives it contains."

