# CV – shown on /cv/ ("CV" in the menu). Every list: newest first (add new entries at the top).
# Memberships stay in memberships.yml; publications, talks and conferences are counted
# from their own files and linked.
#
# Fields of an entry (leave out the lines you do not need):
#   - years: 2021–2023                 # as it should appear; without years the date column stays empty
#     title: What                      # main line; *italics* with one asterisk on each side
#     place: Institution
#     with: Name                       # host or supervisor, shown as "(with Name)"
#     note: An extra line
#     url: https://…                   # links the main line
#
# Courses (only under teaching) – template for one course, see README section 8:
#     courses:
#       - term: Winter semester 2013/14
#         kind: Seminar                # optional: Seminar, Lecture, …
#         title: Title of the course   # the official title (shown in quotation marks);
#                                      # without one, write topic: instead (shown without)
#         text: One or two sentences on the course.     # optional
#         sessions:                    # optional: session plan, shown folded
#           - "§§ 1–25: Topic of the session"
#         readings:                    # optional, shown with the session plan
#           - "Author: *Title*, Place Year"

