- years: 2013–2014
  title: Seminars on Wittgenstein’s philosophy (teaching assignments, with examinations)
  place: Institute of Philosophy, TU Dresden
  courses:
    - term: Summer semester 2014
      kind: Seminar
      title: "Ludwig Wittgenstein: Über Gewißheit"
      text: "Written until a few days before his death, *On Certainty* can be read as Wittgenstein’s philosophical testament. The seminar introduced his late thought and its place in the wider discourse of philosophy through a problem-oriented reading of selected sections. Taught in German, for BA and teacher-training modules (philosophy and ethics). Text: Ludwig Wittgenstein, *Über Gewißheit*, Frankfurt am Main: Suhrkamp 1984."
    - term: Winter semester 2013/14
      kind: Seminar
      title: "Ludwig Wittgenstein: Philosophische Untersuchungen"
      text: An introduction to Wittgenstein’s thought through the reading and discussion of sections of the *Philosophical Investigations*. Taught in German.
      sessions:
        - Introductory session
        - "§§ 1–25: Language games and meaning I"
        - "§§ 26–43: Language games and meaning II"
        - "§§ 44–64: Analysis of language"
        - "§§ 65–88: Family resemblance"
        - "§§ 89–133: Language and philosophy"
        - "§§ 134–155: Rule-following I – understanding and knowing"
        - "§§ 156–178: Rule-following II – reading"
        - "§§ 179–197: Rule-following III – meaning something (Meinen)"
        - "§§ 198–242: Rule-following IV – rules and form of life"
        - "§§ 243–280: Private language I"
        - "§§ 281–315: Private language II"
        - "§§ 633–693 and concluding discussion"
      readings:
        - "Ludwig Wittgenstein: *Philosophische Untersuchungen*, Frankfurt am Main: Suhrkamp 2003"
        - "Eike von Savigny (ed.): *Ludwig Wittgenstein: Philosophische Untersuchungen* (Klassiker Auslegen), Berlin: Akademie Verlag 1998"
        - "Ernst Michael Lange: *Ludwig Wittgenstein: Philosophische Untersuchungen. Eine kommentierende Einführung*, Stuttgart: UTB 1998"
        - "Wolfgang Kienzler: *Ludwig Wittgensteins „Philosophische Untersuchungen“*, Darmstadt: Wissenschaftliche Buchgesellschaft 2007"
        - "Peter M. S. Hacker: *Wittgenstein im Kontext der analytischen Philosophie*, Frankfurt am Main: Suhrkamp 1997"
        - "Thomas Rentsch: *Heidegger und Wittgenstein*, Stuttgart: Klett-Cotta 2003"
        - "Ray Monk: *Wittgenstein. Das Handwerk des Genies*, Stuttgart 2004"

