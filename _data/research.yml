      url: /conferences/#further

habilitation:
  heading: Where both fields meet
  title: Zur literarischen Form von Philosophie – Grundlinien eines Systems der Literatur
  note: Habilitation thesis, University of Zurich
  text: |-
    My habilitation thesis brings both fields together. It systematizes and integrates the different methods of literary-philosophical research to make them more productive for philosophical inquiry and problem-solving. It is grounded in the idea of a “system of literature” as a methodological foundation for understanding philosophical writings, and tests the method on the main works of Hegel and Wittgenstein: the *Phenomenology of Spirit* and the *Philosophical Investigations*.

further: >-
  Further work concerns Wittgenstein and photography and the question of transcendence
  in Hegel, Heidegger and Charles Taylor.
