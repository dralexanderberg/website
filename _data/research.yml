# RESEARCH – shown on /research/: the two fields of research and the habilitation that connects them.
# Texts may use *italics* (one asterisk on each side). Separate paragraphs with an empty line.
# "publications" and "talks" list ids from publications.yml and talks.yml, in the order shown.

intro: >-
  My research has two fields: Wittgenstein and Hegel, which belongs to philosophy proper,
  and the literary form of philosophy, which I have pursued at the University of Zurich
  since 2020. My habilitation brings them together.

fields:

- id: wittgenstein-and-hegel
  title: Wittgenstein and Hegel
  text: |-
    In 1948, on a walk in Dublin, Wittgenstein told Maurice O’C. Drury: “Hegel seems to me to be always wanting to say that things which look different are really the same. Whereas my interest is in showing that things which look the same are really different.” This difference is the starting point of my research: How did Wittgenstein come to know Hegel’s philosophy, and what does his remark reveal? Where do Hegelian motifs appear in Wittgenstein, and Wittgensteinian motifs in Hegel? What role did Neo-Hegelianism and British Idealism play in the emergence of analytic philosophy? My chapter [“Identity in Difference – Wittgenstein’s Hegel”](/texts/berg-2019-identity-in-difference.pdf) (2019) traces the first two questions back to Bertrand Russell and C. D. Broad, from whom Wittgenstein learnt about Hegel.

    From 2017 to 2024 I initiated and organized, together with colleagues, six international conferences on these questions; three volumes have come out of them. This research continues – next with an Element on Wittgenstein and Hegel for Cambridge University Press.
  publications:
    - wittgenstein-and-hegel-elements
    - wittgensteins-hegel
    - synthesis-philosophica-41-1
    - wittgenstein-classical-german-philosophy
    - wittgenstein-hegel-reevaluation
    - uebersichtliche-darstellung-2025
    - absolute-negativity-tractatus
    - identity-in-difference
    - begriffe-des-psychischen
  links:
    - label: Conference series “Wittgenstein & Hegel”, 2017–2024
      url: /conferences/#series

- id: literary-form
  title: The Literary Form of Philosophy
  text: |-
    Since 2020, at the University of Zurich, I have been working on the literary form of philosophy. Here I turn to literary studies and develop its methods for the reading of philosophical texts: questions of a literary history of philosophy – constellation, intertextuality, literarity – and the literary form of individual works such as Hegel’s *Phenomenology of Spirit* and Wittgenstein’s *Philosophical Investigations*.

    A conference on the literary form of philosophy is in preparation.
  publications:
    - literarische-form-phaenomenologie
    - goethe-influence-phenomenology
  talks:
