# CONFERENCES – shown on /conferences/.
#
# in_preparation: conferences being prepared (shown first).
# series:         the six conferences of the series "Wittgenstein & Hegel", newest first.
# further:        other conferences and workshops organized, newest first.
#
# Template for a talk in a talk list:
#     - speaker: Name (Affiliation)
#       title: Title of the talk
#       video: https://youtu.be/…        # optional
#     - day: Monday, 9 Sept.             # optional heading inside the list
#
# Template for a new entry under "in_preparation" or "further":
# - id: short-name                       # needed only if the Work Diary refers to it (conf: short-name)
#   field: literary-form                 # optional: also shown in this field on the Research page
#                                        # (literary-form or wittgenstein-and-hegel, as in research.yml)
#   title: Title of the conference or workshop
#   dates: 1–3 Sept. 2027                # leave out if not yet known
#   place: University of …               # leave out if not yet known
#   with: Co-organizer, Co-organizer     # leave out if not yet known
#   speakers: Name and Name              # optional
#   talks: (list of talks, as in the series below; shown as “Talks (n)”)  # optional
#   url: https://…                       # optional
#
# Poster of a conference in the series (optional): a preview image, 480 px wide, in images/posters/,
# and the PDF under "files:" with the label "Poster".
#   poster: /images/posters/city-year.jpg
#   poster_height: 309                   # only for a landscape poster (height of the preview)
#   poster_by: Name                      # designer, shown under the poster – only if someone else designed it
#   poster_photo: Name                   # optional: photographer, likewise only if someone else
#   poster_note: Text                    # optional: a sentence before the credit
# The same fields also work for an entry under "further".

in_preparation:

# The planned conference is entered only here: the Conferences page, the Work Diary
# (entry with conf: literary-form-conference) and the Research page take it from here.
- id: literary-form-conference
  field: literary-form
  title: A conference on the literary form of philosophy

series:

