# SELECTED TEXTS – a few texts to read or download.
# As long as this file contains no entries, the section stays hidden everywhere.
#
# A text on this website:
# 1. Upload the PDF into the folder "texts/" (e.g. texts/berg-2019-identity-in-difference.pdf).
# 2. Copy the template below, remove the "# " at the start of each line, fill in.
# A text that the publisher offers for free: leave out "file" and give the link under "open_access".
#
# - pub: identity-in-difference    # id of the entry in publications.yml
#   file: /texts/berg-2019-identity-in-difference.pdf   # leave out if the text is only linked
#   version: accepted manuscript   # preprint | accepted manuscript | publisher's version
#   cite: "Alexander Berg, Identity in Difference – Wittgenstein’s Hegel, in: … (De Gruyter 2019), 349–364."
#   open_access: https://…         # optional: free version at the publisher or conference
#   note: One sentence on what the text is about.   # optional

- pub: identity-in-difference
  file: /texts/berg-2019-identity-in-difference.pdf
  version: accepted manuscript
  cite: "Alexander Berg, “Identity in Difference—Wittgenstein’s Hegel”, in: Jakub Mácha & Alexander Berg (eds.), Wittgenstein and Hegel – Reevaluation of Difference, De Gruyter 2019, pp. 349–364."
  note: How Wittgenstein learnt about Hegel’s philosophy – from Bertrand Russell and from C. D. Broad – and what his remark to Drury about Hegel reveals.

- pub: photo-album-experiment
  version: publisher’s version, free at the publisher
  cite: "Alexander Berg, “Wittgenstein’s Photo Album as a Philosophical Experiment”, in: Károly Kókai (ed.), Zeit der Unkultur – Ludwig Wittgenstein im Österreich der Zwischenkriegszeit, NoPress, Vienna 2022, pp. 203–220."
  open_access: https://www.nopress.at/wittgenstein/
  note: On the pocket notebook in which Wittgenstein arranged photographs instead of written remarks – read as a philosophical experiment.
