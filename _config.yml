# Site settings. Changes here take effect after the next build (about one minute).
title: Alexander Berg
author: Alexander Berg
email: alexander@alexanderberg.ch
# ORCID iD and PhilPeople profile name (philpeople.org/profiles/…), linked on the
# Contact page (leave a line empty to hide that link).
orcid: "0000-0002-3409-0396"
philpeople: alexander-berg
# Verification code from Google Search Console (method "HTML tag": only the value of
# content="…"). Adds an invisible meta tag, no tracking. Leave empty if not used.
google_site_verification: ""
description: >-
  Alexander Berg, philosopher: Wittgenstein and Hegel, and the literary form
  of philosophy.
url: https://alexanderberg.ch
baseurl: ""
lang: en

# Portrait on the home page. true = use the prepared sizes portrait-400/600/800.jpg;
# false = use images/portrait.jpg directly (after uploading a new photo).
portrait_crops: true
# Photographer of the portrait, shown under it as "Photo: …" (leave empty to hide).
portrait_credit: Iveta Ryšavá

# Number of entries shown under "Recently published" in the Work Diary;
# older ones move to the archive on the Work Diary page.
diary_recent_count: 3

plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
