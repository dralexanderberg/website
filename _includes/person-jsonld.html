<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Alexander Berg",
  "honorificPrefix": "Dr. phil.",
  "affiliation": { "@type": "CollegeOrUniversity", "name": "University of Zurich" },
  "knowsAbout": ["Ludwig Wittgenstein", "G. W. F. Hegel", "Literary form of philosophy", "German Idealism"],
  "url": "{{ '/' | absolute_url }}",
{%- capture same_as %}{% if site.orcid %}"https://orcid.org/{{ site.orcid }}"|{% endif %}{% if site.philpeople %}"https://philpeople.org/profiles/{{ site.philpeople }}"|{% endif %}{% if site.google_scholar %}"https://scholar.google.com/citations?user={{ site.google_scholar }}"|{% endif %}{% endcapture %}
{%- if same_as != "" %}
  "sameAs": [{{ same_as | split: "|" | join: ", " }}],
{%- endif %}
  "image": "{% if site.portrait_crops %}{{ '/images/portrait-800.jpg' | absolute_url }}{% else %}{{ '/images/portrait.jpg' | absolute_url }}{% endif %}"
}
</script>
